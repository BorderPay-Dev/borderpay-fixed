name: Predeploy Gate

on:
  workflow_dispatch:
  pull_request:

jobs:
  predeploy-gate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PREDEPLOY_CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Test payout SCA, EURC and native verification behavior
        run: >-
          deno test --node-modules-dir=auto --allow-env
          tests/regional-wallet-scope.test.ts
          tests/regional-wallet-provision-http.test.ts
          tests/wallet-scope-refresh-http.test.ts
          tests/external-account-list-http.test.ts
          tests/external-account-delete-http.test.ts
          tests/bridge-initiation-http.test.ts
          tests/bridge-transfer-webhook-owner.test.ts
          tests/va-settlement-receipt.test.ts
          tests/maintenance-invoice-email.test.ts
          tests/sca-payment-runtime.test.ts
          tests/sca-authorization-http.test.ts
          tests/usdt-transfer-http.test.ts
          tests/bridge-transfer-outcome-http.test.ts
          tests/bridge-transfer-ui-outcome.test.ts
          tests/bridge-approved-account-status.test.ts
          tests/hosted-verification-resume-http.test.ts
          tests/bridge-wallet-activity-resource.test.ts
          tests/external-wallet-eurc-http.test.ts
          tests/saved-external-wallets.test.ts
          tests/saved-bank-accounts.test.ts
          tests/hosted-terms-acceptance.test.ts
          tests/wallet-asset-scope-cache.test.ts
          tests/bridge-va-wallet-sync-http.test.ts
          tests/unit/base_wallet_funding_test.ts
          tests/unit/crypto_address_test.ts
          tests/bridge-eea-sca-scope.test.ts
          tests/unit/hosted_verification_test.ts
          tests/unit/bridge_verification_url_test.ts

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Run unified predeploy gate
        run: python3 scripts/predeploy/run_predeploy_gate.py --ci
