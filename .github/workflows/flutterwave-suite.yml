name: Flutterwave Suite

on:
  pull_request:
    branches: [ main ]
    paths:
      - "supabase/functions/flutterwave-*/**"
      - "supabase/functions/_shared/providers/flutterwave*.ts"
      - "supabase/functions/_shared/providers/provider-corridor-policy.ts"
      - "supabase/functions/_shared/payouts/corridor-router.ts"
      - "supabase/migrations/*flutterwave*.sql"
      - "tests/audit/flutterwave_*_audit.py"
      - ".env.example"
  workflow_dispatch:

jobs:
  flutterwave-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Flutterwave suite audit
        run: python3 tests/audit/flutterwave_suite_runner_audit.py

