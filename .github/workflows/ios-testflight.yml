name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Marketing version shown in App Store Connect"
        required: true
        default: "1.0.2"
      build_number:
        description: "App Store build number. Must be 42 or higher."
        required: true
        default: "42"
      upload_to_testflight:
        description: "Upload the signed IPA to TestFlight"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-testflight:
    name: Build iOS IPA
    runs-on: macos-26
    timeout-minutes: 75

    env:
      BUNDLE_ID: com.borderpayafrica.app
      XCODE_PROJECT: ios/App/App.xcodeproj
      XCODE_SCHEME: App
      ARCHIVE_NAME: BorderPayAfrica.xcarchive
      EXPORT_DIR: build/ios
      APP_VERSION: ${{ inputs.app_version }}
      REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify required Apple secrets
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID GitHub secret}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID GitHub secret}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Missing APP_STORE_CONNECT_KEY_IDENTIFIER GitHub secret}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Missing APP_STORE_CONNECT_PRIVATE_KEY GitHub secret}"
          : "${IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64:?Missing IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 GitHub secret}"

      - name: Install and validate iOS Firebase configuration
        run: |
          set -euo pipefail
          printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" \
            | base64 --decode \
            > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist
          FIREBASE_BUNDLE_ID="$(plutil -extract BUNDLE_ID raw ios/App/App/GoogleService-Info.plist)"
          if [ "$FIREBASE_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "Firebase bundle ID mismatch: expected $BUNDLE_ID, got $FIREBASE_BUNDLE_ID" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Verify app-lock navigation regression gates
        run: |
          python3 tests/audit/app_lock_audit.py
          python3 tests/audit/app_lock_no_logout_audit.py
          python3 tests/audit/app_lock_screen_restore_audit.py

      - name: Verify non-EEA SCA scope regression gate
        run: python3 tests/audit/non_eea_sca_scope_audit.py

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Resolve App Store build number
        id: ios-build
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER="${REQUESTED_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Build number must be a positive integer, got: $BUILD_NUMBER" >&2
            exit 1
          fi
          if [ "$BUILD_NUMBER" -le 41 ]; then
            echo "Build number must be 42 or higher, got: $BUILD_NUMBER" >&2
            exit 1
          fi
          echo "number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Using iOS build number $BUILD_NUMBER"

      - name: Install App Store Connect API key
        id: asc-key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"].strip()
          key = key.replace("\\n", "\n")
          key_id = os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"].strip()

          paths = [
              Path(os.environ["RUNNER_TEMP"]) / "private_keys" / f"AuthKey_{key_id}.p8",
              Path.home() / ".appstoreconnect" / "private_keys" / f"AuthKey_{key_id}.p8",
          ]
          for path in paths:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(key + "\n")
              path.chmod(0o600)
          PY
          echo "key-path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>destination</key>
            <string>export</string>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Archive iOS app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/$ARCHIVE_NAME" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc-key.outputs.key-path }}" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="${{ steps.ios-build.outputs.number }}" \
            clean archive

      - name: Export signed IPA
        run: |
          set -euo pipefail
          EXPORT_PATH="$GITHUB_WORKSPACE/$EXPORT_DIR"
          mkdir -p "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$ARCHIVE_NAME" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc-key.outputs.key-path }}" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          ls -la "$EXPORT_PATH"

      - name: Verify launch-critical resources in exported IPA
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$GITHUB_WORKSPACE/$EXPORT_DIR" -maxdepth 1 -name '*.ipa' | head -n 1)"
          test -n "$IPA_PATH"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/exported-ipa"
          APP_PATH="$(find "$RUNNER_TEMP/exported-ipa/Payload" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -f "$APP_PATH/GoogleService-Info.plist"
          plutil -lint "$APP_PATH/GoogleService-Info.plist"
          test "$(plutil -extract BUNDLE_ID raw "$APP_PATH/GoogleService-Info.plist")" = "$BUNDLE_ID"
          test -f "$APP_PATH/capacitor.config.json"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: borderpay-ios-ipa
          path: build/ios/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS archive and dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: borderpay-ios-archive-${{ steps.ios-build.outputs.number }}
          path: ${{ runner.temp }}/BorderPayAfrica.xcarchive
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$GITHUB_WORKSPACE/$EXPORT_DIR" -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found in $GITHUB_WORKSPACE/$EXPORT_DIR"
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
