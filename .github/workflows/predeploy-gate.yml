name: Predeploy Gate

on:
  workflow_dispatch:
  pull_request:

jobs:
  predeploy-gate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PREDEPLOY_CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install app dependencies
        run: npm ci

      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke gate
        run: npm run smoke:browser

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Run unified predeploy gate
        run: python3 scripts/predeploy/run_predeploy_gate.py --ci
