# Supabase local/CI configuration for BorderPay Africa
# This file configures edge functions — remote deploys use these settings too.

project_id = "orwrcpwsffjlvzuraxjc"

# ── Edge function-specific overrides ────────────────────────────────────────

# kyc-submit — LEGACY, REMOVED. Repo source is a 410 "Gone" stub and the function
# is NOT deployed. The live KYC flow is the Bridge hosted-link
# (bridge-customer → bridge-kyc-link / bridge-kyb-link). This pin is retained
# (harmless) only so that IF the 410 stub were ever deployed it stays gated; per
# Decision A we accept the platform 404 and do not deploy the stub absent a real
# stale caller. See docs/bridge-pr3-kyc-submit-retirement.md.
[functions.kyc-submit]
verify_jwt = true

# KYC status — authenticated polling endpoint used by the under_review screen.
[functions.kyc-status]
verify_jwt = true

# User profile read — authenticated; derives the caller's identity from their JWT
# (supabase.auth.getUser(token)). MUST stay JWT-gated — never deploy with
# --no-verify-jwt. Pinned explicitly so the deploy default can't be flipped.
[functions.get-user-profile]
verify_jwt = true

# Bridge external accounts — authenticated payout destination endpoint.
[functions.bridge-external-account]
verify_jwt = true

# Bridge webhook receiver — public; Bridge signs requests (no JWT).
[functions.bridge-webhook]
verify_jwt = false

# Queue worker — public; invoked by pg_cron + DB webhook (no JWT).
[functions.process-pending-events]
verify_jwt = false

# WebAuthn credential delete — authenticated; deletes only the caller's rows.
[functions.webauthn-delete]
verify_jwt = true

# Unified transactional email sender — public route; gated IN-CODE by the
# SEND_EMAIL_INTERNAL_TOKEN bearer (NOT the service-role key, not a user JWT).
# Writes public.email_log before every Resend call. Must be deployed BEFORE
# auth-signup / auth-resend-verification / auth-reset-password (they call it;
# absent → 404).
[functions.send-email]
verify_jwt = false

# Legacy confirmation sender (deprecated). Kept for compatibility only and now
# locked down in-code by SEND_EMAIL_INTERNAL_TOKEN + app-origin validation.
[functions.send-confirmation-email]
verify_jwt = false

# Forgot-password request — public route (forgot-password form). Generates a
# GoTrue recovery link and sends the reset email via the logged send-email.
# Enumeration-safe (uniform generic response).
[functions.auth-reset-password]
verify_jwt = false

# Password reset confirm — public route; verifies the GoTrue recovery token and
# sets the new password (preserves 2FA/PIN). Brought into repo at deployed
# parity for P0-b; deploy is a separate gated step.
[functions.auth-reset-password-confirm]
verify_jwt = false

# ── Bridge onboarding / money-movement (go-live gated) ──────────────────────
# These pins MATCH the live deployed reality so a CLI redeploy can't silently
# flip auth. The three onboarding starters validate the JWT THEMSELVES
# (supabase.auth.getUser(token)) and run verify_jwt=false in production; without
# these pins the CLI default (true) would flip them. bridge-transfer runs
# verify_jwt=true. Pinned explicitly so `supabase functions deploy <fn>` is
# reproducible with no per-command flags.

# Bridge customer create — onboarding starter; self-validates JWT. Fail-closed
# on BRIDGE_ONBOARDING_ENABLED.
[functions.bridge-customer]
verify_jwt = false

# Bridge KYC link — onboarding starter; self-validates JWT. Fail-closed on
# BRIDGE_ONBOARDING_ENABLED.
[functions.bridge-kyc-link]
verify_jwt = false

# Bridge KYB link — onboarding starter; self-validates JWT. Fail-closed on
# BRIDGE_ONBOARDING_ENABLED.
[functions.bridge-kyb-link]
verify_jwt = false

# Bridge transfer — money movement; authenticated. Fail-closed on
# BRIDGE_TRANSFERS_ENABLED. Runs verify_jwt=true (platform validates the JWT,
# the function then re-checks customer + KYC).
[functions.bridge-transfer]
verify_jwt = true

# Bulk payouts (payroll/supplier/contractor/marketplace) — same money gate as
# bridge-transfer (BRIDGE_TRANSFERS_ENABLED) + KYC + activated plan.
[functions.bridge-bulk-payout]
verify_jwt = true

# Read-only Bridge → local mirror (wallets + virtual accounts). No money move.
[functions.bridge-sync-accounts]
verify_jwt = true

# Auto-provision base stablecoin wallets (USDC/USDT) for activated users.
[functions.bridge-provision-stablecoins]
verify_jwt = true

# Authorize verification — admin-only gate clearance (NOT yet deployed). Requires
# a valid JWT at the platform; the function then enforces the admin/service
# check in-code before charging billable Bridge KYC/KYB.
[functions.authorize-verification]
verify_jwt = true

# Saved external stablecoin payout addresses (user-authenticated; server-side
# address validation; no money movement).
[functions.external-wallet]
verify_jwt = true

# RC1 observability watchdog — machine-to-machine probe endpoint; uses
# in-function bearer validation via RC1_WATCHDOG_TOKEN (not a Supabase Auth JWT).
# Must remain verify_jwt=false so the platform does not reject the token format.
[functions.rc1-watchdog]
verify_jwt = false

# Admin broadcast/live email operations — machine-to-machine endpoints gated by
# ADMIN_BROADCAST_INTERNAL_TOKEN in-code.
[functions.admin-broadcast-email]
verify_jwt = false

[functions.admin-email-ops]
verify_jwt = false

# Unified support gateway:
# - public website ticket create (public_create_ticket)
# - authenticated app ticket flow
# - authenticated admin queue/reply/status flow
# JWT is validated in-function per action, so this stays false to allow website
# submissions while preserving auth checks for non-public actions.
[functions.support-gateway]
verify_jwt = false
