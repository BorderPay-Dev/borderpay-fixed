name: Payment SCA database contract
on:
  pull_request:
    paths:
      - 'supabase/migrations/20260915170000_payment_sca_evidence_contract.sql'
      - 'tests/sql/payment_sca_*.sql'
      - 'tests/sql/usdt_read_*.sql'
      - 'tests/sql/regional_wallet_read_contract.sql'
      - 'tests/sql/regional_financial_guard_*.sql'
      - 'tests/sql/wallet_scope_refresh*.sql'
      - 'supabase/migrations/20260916120000_prioritize_real_wallet_scope_refresh.sql'
      - 'supabase/migrations/2026091611*.sql'
      - 'supabase/migrations/20260916100000_regional_financial_read_guard.sql'
      - 'supabase/migrations/20260916090000_regional_wallet_asset_reads.sql'
      - 'supabase/migrations/20260915190000_restore_non_eea_usdt_reads.sql'
      - '.github/workflows/payment-sca-db.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sca-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: sca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: sca_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test migration and payment evidence behavior in disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/payment_sca_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260915170000_payment_sca_evidence_contract.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260915170000_payment_sca_evidence_contract.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/payment_sca_contract.sql
      - name: Test non-EEA USDT reads and unchanged write restrictions
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/usdt_read_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260915190000_restore_non_eea_usdt_reads.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260915190000_restore_non_eea_usdt_reads.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/usdt_read_contract.sql
      - name: Test EEA EURC and non-EEA USDT isolation
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916090000_regional_wallet_asset_reads.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916090000_regional_wallet_asset_reads.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/regional_wallet_read_contract.sql
      - name: Test production financial guard with regional ownership
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/regional_financial_guard_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916100000_regional_financial_read_guard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916100000_regional_financial_read_guard.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/regional_financial_guard_contract.sql
      - name: Test background scope refresh leases and eligibility
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916110000_wallet_scope_refresh_queue.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916110000_wallet_scope_refresh_queue.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/wallet_scope_refresh_contract.sql
      - name: Test existing wallet priority and demo isolation
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916120000_prioritize_real_wallet_scope_refresh.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916120000_prioritize_real_wallet_scope_refresh.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/wallet_scope_refresh_priority_contract.sql
