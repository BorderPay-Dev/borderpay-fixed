name: Production Deploy

on:
  workflow_dispatch:

jobs:
  predeploy-gate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Enforce unified predeploy gate
        run: python3 scripts/predeploy/run_predeploy_gate.py --ci

  deploy:
    needs: predeploy-gate
    runs-on: ubuntu-latest
    steps:
      - name: Deployment placeholder
        run: |
          echo "Predeploy gate passed."
          echo "No automated production deployment is configured in this workflow."

