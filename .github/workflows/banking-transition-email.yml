name: Banking transition email
on:
  push:
    branches: [feat/banking-transition-campaign]
  pull_request:
    paths:
      - 'supabase/functions/_shared/email-templates/banking-transition*'
      - 'tests/banking-transition-email.test.ts'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-config tests/banking-transition-email.test.ts tests/invoice-hub-email.test.ts tests/mobile-app-update-email.test.ts
