name: Production Deploy

on:
  workflow_dispatch:

jobs:
  predeploy-gate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Enforce unified predeploy gate
        run: python3 scripts/predeploy/run_predeploy_gate.py --ci

  deploy:
    needs: predeploy-gate
    runs-on: ubuntu-latest
    steps:
      - name: Deployment placeholder
        run: |
          echo "Predeploy gate passed."
          echo "No automated production deployment is configured in this workflow."
