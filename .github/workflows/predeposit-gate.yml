name: Pre-deposit compliance gate
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/predeposit-*.ts'
      - 'supabase/functions/predeposit-*/**'
      - 'supabase/functions/bridge-virtual-account/**'
      - 'components/invoices/**'
      - 'utils/api/backendAPI.ts'
      - 'supabase/migrations/*predeposit*.sql'
      - 'tests/predeposit-*'
      - 'docs/PREDEPOSIT_GATE_V24_BUILD_SPEC.md'
      - '.github/workflows/predeposit-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules-and-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate rules, Azure failures, CRM matching and OCR boundaries
        run: deno test --no-config --allow-env tests/predeposit-policy.test.ts tests/predeposit-document-comparison.test.ts tests/predeposit-ocr.test.ts tests/predeposit-content-understanding.test.ts tests/predeposit-self-test.test.ts tests/predeposit-ai-config.test.ts tests/predeposit-extraction.test.ts tests/predeposit-http-boundary.test.ts tests/predeposit-va-compat.test.ts tests/predeposit-provider-capabilities.test.ts tests/predeposit-access.test.ts tests/api-customer-runtime.test.ts tests/providers/bridge-business-name.test.ts tests/predeposit-hub-http.test.ts tests/invoice-hub-email.test.ts
      - name: Typecheck invoice endpoints
        run: deno check --no-config supabase/functions/bridge-virtual-account/index.ts supabase/functions/predeposit-hub/index.ts supabase/functions/predeposit-worker/index.ts supabase/functions/bridge-sync-accounts/index.ts supabase/functions/public-api-gateway/index.ts
      - name: Render invoice PDF fixtures
        run: |
          curl -fsSL https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf -o /tmp/predeposit-font.ttf
          curl -fsSL https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf -o /tmp/predeposit-bold.ttf
          deno run --no-config --allow-read=/tmp/predeposit-font.ttf,/tmp/predeposit-bold.ttf,public/logo-color.png,supabase/migrations/20260923020000_predeposit_consumer_agreements.sql --allow-write=/tmp/predeposit-pdf-qa tests/predeposit-pdf.test.ts
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdftoppm -scale-to 1300 -png /tmp/predeposit-pdf-qa/approved.pdf /tmp/predeposit-pdf-qa/approved
          pdftotext /tmp/predeposit-pdf-qa/approved.pdf /tmp/predeposit-pdf-qa/approved.txt
          pdftotext /tmp/predeposit-pdf-qa/pending.pdf /tmp/predeposit-pdf-qa/pending.txt
          pdftotext /tmp/predeposit-pdf-qa/invoice-copy.pdf /tmp/predeposit-pdf-qa/invoice-copy.txt
          pdftoppm -scale-to 1300 -png /tmp/predeposit-pdf-qa/invoice-copy.pdf /tmp/predeposit-pdf-qa/invoice-copy
          pdftotext /tmp/predeposit-pdf-qa/observation-invoice.pdf /tmp/predeposit-pdf-qa/observation-invoice.txt
          pdftoppm -scale-to 1300 -png /tmp/predeposit-pdf-qa/observation-invoice.pdf /tmp/predeposit-pdf-qa/observation-invoice
          pdftotext /tmp/predeposit-pdf-qa/long-invoice.pdf /tmp/predeposit-pdf-qa/long-invoice.txt
          pdftotext /tmp/predeposit-pdf-qa/agreement.pdf /tmp/predeposit-pdf-qa/agreement.txt
          pdftotext /tmp/predeposit-pdf-qa/usd-invoice.pdf /tmp/predeposit-pdf-qa/usd-invoice.txt
          for kind in d2c b2c; do
            pdftoppm -scale-to 1300 -png /tmp/predeposit-pdf-qa/$kind-agreement.pdf /tmp/predeposit-pdf-qa/$kind-agreement
            pdftotext /tmp/predeposit-pdf-qa/$kind-agreement.pdf /tmp/predeposit-pdf-qa/$kind-agreement.txt
            grep -q "DRAFT FOR REVIEW" /tmp/predeposit-pdf-qa/$kind-agreement.txt
            grep -q "Signature not applied" /tmp/predeposit-pdf-qa/$kind-agreement.txt
            if grep -q "{{" /tmp/predeposit-pdf-qa/$kind-agreement.txt; then exit 1; fi
          done
          python3 tests/predeposit-pdf-text.test.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: invoice-pdf-review
          path: /tmp/predeposit-pdf-qa
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated database test runtime
        run: npm install --prefix /tmp/predeposit-db-test --no-save --package-lock=false @electric-sql/pglite@0.3.14
      - name: Validate evidence access and worker state transitions
        run: |
          PGLITE_MODULE=file:///tmp/predeposit-db-test/node_modules/@electric-sql/pglite/dist/index.js node tests/predeposit-evidence.test.mjs
          PGLITE_MODULE=file:///tmp/predeposit-db-test/node_modules/@electric-sql/pglite/dist/index.js node tests/predeposit-reconciliation.test.mjs
          PGLITE_MODULE=file:///tmp/predeposit-db-test/node_modules/@electric-sql/pglite/dist/index.js node tests/predeposit-document-checks.test.mjs

  merchant-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx vite build

      - name: Exercise merchant screens in mobile and desktop browsers
        run: |
          npm install --prefix /tmp/predeposit-browser --no-save --package-lock=false playwright@1.58.2
          /tmp/predeposit-browser/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/predeposit-pdf-qa
          npx vite --host 127.0.0.1 --port 4173 > /tmp/predeposit-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          PLAYWRIGHT_MODULE=file:///tmp/predeposit-browser/node_modules/playwright/index.mjs node tests/predeposit-ui.test.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: invoice-ui-review
          path: /tmp/predeposit-pdf-qa
