location = /yellowcard/healthz {
    proxy_pass http://127.0.0.1:3101/healthz;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
}

location = /yellowcard/v1/request {
    limit_except POST { deny all; }
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:3101/v1/request;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-BorderPay-YC-Authorization $http_x_borderpay_yc_authorization;
    proxy_set_header X-BorderPay-YC-Timestamp $http_x_borderpay_yc_timestamp;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
}
