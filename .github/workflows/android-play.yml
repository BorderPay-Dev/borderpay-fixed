name: Android Play

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Marketing version shown in Google Play"
        required: true
        default: "1.0"
      upload_to_play:
        description: "Upload the signed AAB to Google Play internal track"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-play:
    name: Build Android AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      PACKAGE_NAME: com.borderpayafrica.app
      APP_VERSION: ${{ inputs.app_version }}
      BUILD_NUMBER: ${{ github.run_number }}
      UPLOAD_TO_PLAY: ${{ inputs.upload_to_play }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Deno for release safety tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Verify Play Store closed-beta safety gates
        run: |
          set -euo pipefail
          deno test tests/african-rails-access.test.ts
          python3 tests/audit/african_rails_closed_beta_gate_audit.py
          python3 tests/audit/yellowcard_transaction_authorization_audit.py
          python3 tests/audit/android_native_auth_audit.py
          python3 tests/audit/android_native_launch_and_listing_audit.py
          python3 tests/audit/yellowcard_timeout_contract_audit.py
          python3 tests/audit/yellowcard_capability_cache_and_reason_audit.py

      - name: Record Android source revision
        run: |
          set -euo pipefail
          echo "Building Android from ${GITHUB_REF_NAME} at ${GITHUB_SHA}"

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android debug APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug \
            -PVERSION_NAME="$APP_VERSION" \
            -PVERSION_CODE="$BUILD_NUMBER"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: borderpay-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Check Android signing secrets
        id: android-signing
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ] \
            && [ -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" ] \
            && [ -n "$ANDROID_UPLOAD_KEY_ALIAS" ] \
            && [ -n "$ANDROID_UPLOAD_KEY_PASSWORD" ]; then
            echo "has-signing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has-signing=false" >> "$GITHUB_OUTPUT"
          if [ "$UPLOAD_TO_PLAY" = "true" ]; then
            echo "Missing Android signing secrets required for Google Play upload." >&2
            echo "Required: ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD" >&2
            exit 1
          fi

          echo "Android signing secrets are not configured. Debug APK was built; signed AAB will be skipped."

      - name: Install Android upload keystore
        if: ${{ steps.android-signing.outputs.has-signing == 'true' }}
        run: |
          set -euo pipefail
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_UPLOAD_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_UPLOAD_KEY_ALIAS}
          keyPassword=${ANDROID_UPLOAD_KEY_PASSWORD}
          EOF

      - name: Build signed Android App Bundle
        if: ${{ steps.android-signing.outputs.has-signing == 'true' }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew bundleRelease \
            -PVERSION_NAME="$APP_VERSION" \
            -PVERSION_CODE="$BUILD_NUMBER"

      - name: Upload AAB artifact
        if: ${{ steps.android-signing.outputs.has-signing == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: borderpay-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Verify Google Play service account
        if: ${{ inputs.upload_to_play && steps.android-signing.outputs.has-signing == 'true' }}
        run: |
          set -euo pipefail
          : "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:?Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON GitHub secret}"
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-play-service-account.json"

      - name: Install Google Play listing uploader
        if: ${{ inputs.upload_to_play && steps.android-signing.outputs.has-signing == 'true' }}
        run: |
          gem install --user-install fastlane --no-document
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Upload to Google Play internal testing
        if: ${{ inputs.upload_to_play && steps.android-signing.outputs.has-signing == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Publish Google Play name and icon
        if: ${{ inputs.upload_to_play && steps.android-signing.outputs.has-signing == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p android/fastlane/metadata/android/en-US/images
          cp public/icons/icon-512x512.png android/fastlane/metadata/android/en-US/images/icon.png
          fastlane supply \
            --json_key "$RUNNER_TEMP/google-play-service-account.json" \
            --package_name "$PACKAGE_NAME" \
            --metadata_path android/fastlane/metadata/android \
            --track internal \
            --version_code "$BUILD_NUMBER" \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_changelogs true \
            --skip_upload_screenshots true
