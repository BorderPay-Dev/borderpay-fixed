name: Android Play

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Marketing version shown in Google Play"
        required: true
        default: "1.0.4"
      build_number:
        description: "Google Play version code. Must be 52 or higher."
        required: true
        default: "52"
      upload_to_play:
        description: "Upload the signed AAB to Google Play internal track"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-play:
    name: Build Android AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      PACKAGE_NAME: com.borderpayafrica.app
      APP_VERSION: ${{ inputs.app_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      UPLOAD_TO_PLAY: ${{ inputs.upload_to_play }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Validate Android version code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          if (( BUILD_NUMBER < 52 )); then
            echo "Android version code must be 52 or higher."
            exit 1
          fi

      - name: Type check
        run: npm run type-check

      - name: Verify Bridge EEA SCA compliance contract
        run: npm run audit:bridge-sca

      - name: Verify EEA manual wallet and VA prerequisite
        run: python3 tests/audit/eea_manual_wallet_before_va_audit.py

      - name: Verify native App Check release contract
        run: python3 tests/audit/native_app_check_release_audit.py

      - name: Verify iOS and Android mobile release source
        run: python3 tests/audit/mobile_store_source_audit.py

      - name: Verify signup, countries, and fee policy
        run: |
          python3 tests/audit/signup_country_audit.py
          python3 tests/audit/signup_hosted_verification_handoff_audit.py
          python3 tests/audit/signup_phone_optional_app_review_audit.py
          python3 tests/audit/borderpay_fee_schedule_audit.py

      - name: Build web app
        run: npm run build

      - name: Install Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:?Missing ANDROID_GOOGLE_SERVICES_JSON_BASE64 GitHub secret}"
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          node - <<'NODE'
          const config = require('./android/app/google-services.json');
          const packages = config.client
            .map((entry) => entry.client_info?.android_client_info?.package_name)
            .filter(Boolean);
          if (!packages.includes(process.env.PACKAGE_NAME)) {
            throw new Error(`Firebase config does not contain ${process.env.PACKAGE_NAME}`);
          }
          NODE

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify packaged store UI
        run: python3 tests/audit/store_release_bundle_audit.py android

      - name: Verify Play Integrity App Check dependency
        shell: bash
        run: |
          set -euo pipefail
          grep -R "firebase-appcheck-playintegrity" node_modules/@capacitor-firebase/app-check/android
          grep -R "FirebaseAppCheckPlugin" android/app/src/main/assets/capacitor.plugins.json

      - name: Verify generated Android release manifest
        run: |
          set -euo pipefail
          cd android
          ./gradlew processReleaseMainManifest
          cd ..
          python3 tests/audit/android_media_permissions_audit.py --merged

      - name: Build Android debug APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug \
            -PVERSION_NAME="$APP_VERSION" \
            -PVERSION_CODE="$BUILD_NUMBER"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: borderpay-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Check Android signing secrets
        id: android-signing
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ] \
            && [ -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" ] \
            && [ -n "$ANDROID_UPLOAD_KEY_ALIAS" ] \
            && [ -n "$ANDROID_UPLOAD_KEY_PASSWORD" ]; then
            echo "has-signing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has-signing=false" >> "$GITHUB_OUTPUT"
          if [ "$UPLOAD_TO_PLAY" = "true" ]; then
            echo "Missing Android signing secrets required for Google Play upload." >&2
            echo "Required: ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD" >&2
            exit 1
          fi

          echo "Android signing secrets are not configured. Debug APK was built; signed AAB will be skipped."

      - name: Install Android upload keystore
        if: ${{ steps.android-signing.outputs.has-signing == 'true' }}
        run: |
          set -euo pipefail
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_UPLOAD_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_UPLOAD_KEY_ALIAS}
          keyPassword=${ANDROID_UPLOAD_KEY_PASSWORD}
          EOF

      - name: Build signed Android release APK and App Bundle
        if: ${{ steps.android-signing.outputs.has-signing == 'true' }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleRelease bundleRelease \
            -PVERSION_NAME="$APP_VERSION" \
            -PVERSION_CODE="$BUILD_NUMBER"

      - name: Cold-launch signed release on Android emulator
        if: ${{ steps.android-signing.outputs.has-signing == 'true' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel
          disable-animations: true
          script: bash scripts/ci/android-release-launch-smoke.sh

      - name: Upload AAB artifact
        if: ${{ steps.android-signing.outputs.has-signing == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: borderpay-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Verify Android deobfuscation mapping
        if: ${{ steps.android-signing.outputs.has-signing == 'true' }}
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/mapping/release/mapping.txt

      - name: Upload Android deobfuscation mapping
        if: ${{ steps.android-signing.outputs.has-signing == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: borderpay-android-mapping-${{ env.BUILD_NUMBER }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Verify Google Play service account
        if: ${{ inputs.upload_to_play && steps.android-signing.outputs.has-signing == 'true' }}
        run: |
          set -euo pipefail
          : "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:?Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON GitHub secret}"
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-play-service-account.json"

      - name: Install Google Play listing uploader
        if: ${{ inputs.upload_to_play && steps.android-signing.outputs.has-signing == 'true' }}
        run: |
          set -euo pipefail
          gem install --user-install fastlane --no-document
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Upload to Google Play internal testing
        if: ${{ inputs.upload_to_play && steps.android-signing.outputs.has-signing == 'true' }}
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJsonPlainText: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: draft

      - name: Publish Google Play name and icon
        if: ${{ inputs.upload_to_play && steps.android-signing.outputs.has-signing == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p android/fastlane/metadata/android/en-US/images
          cp public/icons/icon-512x512.png android/fastlane/metadata/android/en-US/images/icon.png
          fastlane supply \
            --json_key "$RUNNER_TEMP/google-play-service-account.json" \
            --package_name "$PACKAGE_NAME" \
            --metadata_path android/fastlane/metadata/android \
            --track internal \
            --version_code "$BUILD_NUMBER" \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_changelogs true \
            --skip_upload_screenshots true
