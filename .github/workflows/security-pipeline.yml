name: Security Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - "hotfix/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gates:
    name: Authorization, secrets, dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Reject high-impact secrets in tracked files
        run: python3 scripts/ci/scan_tracked_secrets.py

      - name: Reject unpinned third-party Actions
        run: python3 tests/audit/github_actions_supply_chain_audit.py

      - name: Block high and critical dependency advisories
        run: npm audit --audit-level=high

      - name: Enforce security and lifecycle boundaries
        run: bash scripts/ci/enforce-safety-boundaries.sh

      - name: Verify frozen-account authorization
        run: python3 tests/audit/frozen_account_access_gate_audit.py

      - name: Verify affiliate linked-account SSO
        run: python3 tests/audit/affiliate_sso_link_audit.py

      - name: Verify signup abuse controls
        run: python3 tests/audit/signup_abuse_protection_audit.py

      - name: Verify public authentication defenses
        run: python3 tests/audit/public_auth_defense_audit.py

      - name: Verify partner invite defenses
        run: python3 tests/audit/partner_invite_defense_audit.py

      - name: Verify partner workspace operations
        run: python3 tests/audit/partner_workspace_operations_audit.py

      - name: Verify API gateway client IP trust order
        run: python3 tests/audit/api_gateway_client_ip_audit.py

      - name: Verify Bridge webhook authentication
        run: python3 tests/audit/bridge_webhook_signature_audit.py

      - name: Verify Flutterwave webhook authentication
        run: python3 tests/audit/flutterwave_webhook_hardening_audit.py

      - name: Verify legacy email endpoints remain authenticated
        run: python3 tests/audit/legacy_email_endpoint_security_audit.py

      - name: Type-check public authentication Edge Functions
        run: >-
          deno check --node-modules-dir=auto
          supabase/functions/auth-signup/index.ts
          supabase/functions/auth-resend-verification/index.ts
          supabase/functions/auth-reset-password/index.ts

      - name: Type-check private partner Edge Functions
        run: >-
          deno check --node-modules-dir=auto
          supabase/functions/partner-onboarding/index.ts
          supabase/functions/partner-application-admin/index.ts

      - name: Test Firebase App Check JWT verification
        run: deno test --node-modules-dir=auto tests/firebase-app-check.test.ts

  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          category: "/language:javascript-typescript"
